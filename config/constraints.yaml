# Жёсткие ограничения и модельные диапазоны.
#
# ПРАВИЛО ГРАНИЦ ИЗ ТЗ: если для параметра нет подтверждённого рабочего
# диапазона, исторический min/max НЕЛЬЗЯ выдавать за промышленный предел.
# Каждый диапазон ниже помечен полем source:
#   spec       — требование спецификации, обсуждению не подлежит
#   assumption — наше модельное допущение для эксперимента
 
# ============================================================================
# ЯКОРЬ ПО ИЗМЕРЕННОЙ СЕРЕ
# ============================================================================
# Уровень серы берёт измерение, модель отвечает только за ЭФФЕКТ действия.
# Причина: conformal-интервал абсолютного прогноза GOModel имеет ширину
# 6.3 мг/кг при лимите 10, и жёсткая проверка по hi не проходит НИКОГДА,
# в том числе для варианта "ничего не менять". Измеренная сера точнее
# модели на порядок, поэтому уровень даёт она. Подробности в
# src/agents/quality.py._sulfur_anchored().
sulfur_anchor:
  cycle_min: 10             # период цикла рекомендации, шаг телеметрии

  # q90 РОСТА серы за горизонт [минуты, мг/кг]. Не допущение: эмпирика по
  # ПАК 24-2000:Mg.Sulfur за 01.01.2023-10.08.2026, n=175 тыс. точек после
  # отсечения залипаний (серии >= 6 одинаковых значений подряд).
  # Односторонний квантиль, потому что Gate проверяет серу только сверху.
  growth_q90_mgkg:
    - [10, 0.52]
    - [20, 0.88]
    - [30, 1.14]
    - [60, 1.51]
    - [120, 1.76]
    - [180, 1.95]
    - [360, 2.05]
    - [720, 2.15]
    - [1440, 2.24]
  growth_source: data

  # Какая доля предсказанного эффекта может не реализоваться.
  # Калибровочных данных на ЭФФЕКТ действия нет: в истории есть только
  # фактические траектории, а не пары "режим / контрфактический режим".
  effect_uncertainty_share: 0.5
  effect_source: assumption

  # Физически правдоподобный диапазон серы ГОДТ, мг/кг. Показание
  # поточного анализатора вне него считается сбоем прибора и заменяется
  # (вторым анализатором, иначе прогнозом модели), а НЕ используется как
  # якорь. Замер 2026-09-22 (walk-forward, 5 блоков, против константы):
  #   один ПАК-файл                 RMSE 2.144   -8.0%
  #   один Q21                      RMSE 2.522  -27.0%
  #   среднее двух без защиты       RMSE 1.986   +0.0%
  #   среднее двух с защитой        RMSE 1.756  +11.6%
  # Вне диапазона оказывается 1.7% показаний ПАК-файла и 2.7% Q21, но
  # именно они несут основную часть квадратичной ошибки.
  anchor_plausible_range: [2.0, 15.0]
  anchor_range_source: data

quality_specs:
  sulfur_mgkg:
    display: "сера в товарном ДТ"   # как показывать оператору
    units: "мг/кг"
    limit: 10.0
    direction: max          # значение не должно превышать limit
    check_on: hi            # проверяем по ВЕРХНЕЙ границе интервала, не по mean
    source: spec
    comment: "Товарное ДТ, минимальная жёсткая проверка из ТЗ"
 
  flash_c:
    display: "температура вспышки"   # как показывать оператору
    units: "degC"
    limit: 55.0
    direction: min
    check_on: lo
    source: assumption
    comment: "Модельное допущение. В ЛИМС наблюдается 35..92, медиана 68."
 
  cfpp_c:
    display: "предельная температура фильтруемости"   # как показывать оператору
    units: "degC"
    limit: 0.0
    direction: max
    check_on: hi
    source: assumption
    comment: "Летний сорт. Модельное допущение, сезонность не учтена."
 
  d15_kgm3:
    display: "плотность при 15 C"   # как показывать оператору
    units: "кг/м3"
    limit: 845.0
    direction: max
    check_on: hi
    source: assumption
    comment: "Модельное допущение. В ЛИМС 821.6..856.2."
 
# ============================================================================
# УПРАВЛЯЕМЫЕ ПЕРЕМЕННЫЕ
# ============================================================================
# Отбор шести переменных обоснован тремя независимыми источниками сразу:
#
#   (1) СХЕМА. Рукописные коды на листах АВТ. Синие и зелёные кольца по
#       легенде = управляемые переменные.
#   (2) ЛИТЕРАТУРА. Опубликованный проект APC для ЭЛОУ-АВТ (Газпром
#       нефтехим Салават, Honeywell Profit Controller) перечисляет в
#       качестве ключевых управляющих переменных атмосферной колонны:
#       температуры верха, расходы циркуляционных орошений, температуру
#       выхода печи, расходы продуктов и пара в стриппинги; давления
#       верха включены как вспомогательные управляющие.
#   (3) ДАННЫЕ. Корреляция с конечной точкой кипения (EBP) дизельной
#       фракции, идущей в гидроочистку, по ЛИМС точки отбора 1
#       гидроочистки, n=1260, после отсечения простоев и маркеров 307.0.
#
# ДИАПАЗОНЫ: 5-й и 95-й перцентиль по истории 2023-2026 после отсечения
# 3.5% строк простоя установки (11 эпизодов, самый длинный 486 ч) и
# значений-маркеров 307.0. Это НЕ промышленные пределы, а модельные
# границы рабочей области, поэтому source: assumption.
#
# MAX_STEP: 90-й перцентиль модуля фактического изменения параметра за
# час, то есть система не предлагает движений крупнее тех, что оператор
# делает сам. Это защита от экстраполяции модели за пределы данных.
# ============================================================================
 
manipulated_vars:
 
  "AVT:F30":
    name: "Расход фр.290-350 C с установки"
    units: "t/h"
    range: [104.3, 152.8]
    max_step: 2.5
    grid_points: 1   # ИСПРАВЛЕНО (Person 4): было 5 (11 точек). При 1089
                     # кандидатах на связке с обученной моделью Person 3
                     # цикл занимал ~17с — тесты не укладывались в разумное
                     # время. Теперь только границы trust region: -2.5/0/+2.5.
    active: true     # активна в OptimizerAgent.propose() по умолчанию
    source: assumption
    comment: >
      Схема К-2: синее кольцо на выходе К-9, тяжёлый дизельный поток.
      Литература: расход продукта в стриппинг — ключевая управляющая
      переменная атмосферной колонны. Данные: corr с EBP сырья +0.180.
      Физика: рост отбора утяжеляет хвост, растёт доля трудноудаляемой
      серы, гидроочистке нужен более жёсткий режим. Главная ручка
      компромисса выход-качество. Диапазон p5-p95, медиана 128.4,
      шаг = p90 фактических часовых изменений (2.46).
 
  "AVT:F32":
    name: "Расход фр.240-290 C с установки"
    units: "t/h"
    range: [58.2, 96.1]
    max_step: 2.0
    grid_points: 1   # ИСПРАВЛЕНО (Person 4), см. комментарий у AVT:F30
    active: true     # активна в OptimizerAgent.propose() по умолчанию
    source: assumption
    comment: >
      Схема К-2: синее кольцо на выходе К-9, лёгкий дизельный поток.
      Данные: corr с EBP сырья +0.254, сильнее чем у F30. Вместе с F30
      задаёт и объём, и состав дизельного пула. Медиана 81.7,
      шаг = p90 часовых изменений (1.89).
 
  "AVT:F28":
    name: "Расход пара в К-9"
    units: "t/h"
    range: [150.3, 374.7]
    max_step: 2.5
    grid_points: 5   # шаг 0.5, круглое число (Person 4)
    source: assumption
    comment: >
      Схема К-2: расход пара в стриппинг-колонну К-9.
      Литература: расход пара в стриппинги входит в список ключевых
      управляющих переменных; отгонный пар снижает парциальное давление
      углеводородов и при том же отборе понижает конец кипения продукта.
      Данные: corr с EBP сырья +0.268. Медиана 275.6.
      ВНИМАНИЕ: операторы двигают его редко, p90 часового изменения
      всего 1.40 при размахе 225. Шаг взят как p95 (2.32), округлён.
 
  "AVT:F14":
    name: "Расход 1 ЦО в К-2"
    units: "t/h"
    range: [201.8, 328.2]
    max_step: 6.0
    grid_points: 6   # шаг 1.0, круглое число (Person 4)
    source: assumption
    comment: >
      Схема К-2: синее кольцо на первом циркуляционном орошении.
      Литература: расходы циркуляционных орошений — ключевые управляющие
      переменные, через них регулируется тепловой баланс и внутренняя
      флегма, а значит чёткость разделения. Данные: corr с EBP +0.258.
      2 ЦО (F12, +0.028) и 3 ЦО (F64, +0.039) влияния на дизельный хвост
      не показали и в набор не включены. Шаг = p90 (5.78).
 
  "AVT:P22":
    name: "Давление верха К-2"
    units: "MPa"
    range: [1.00, 1.19]
    max_step: 0.03
    grid_points: 3   # шаг 0.01, круглое число (Person 4)
    source: assumption
    comment: >
      Схема К-2: зелёное кольцо на PIC верха, то есть регулятор,
      а не индикатор. P67 и P21 — те же показания, но индикаторы,
      их оставляем как признаки модели.
      Литература: давления верха включаются как ВСПОМОГАТЕЛЬНЫЕ
      управляющие переменные, поэтому и у нас она шестая по значимости.
      Данные: corr с EBP -0.104, знак правильный — рост давления
      затрудняет испарение и облегчает хвост. Шаг = p90 (0.03).
 
  "242000:T5":
    name: "Реактор Р-201, температура ГСС на выходе"
    units: "degC"
    range: [353.8, 384.6]
    max_step: 2.5
    grid_points: 5   # шаг 0.5, круглое число (Person 4). Разрешение
                     # держим тонким — это главный рычаг компенсации серы.
    active: true     # активна в OptimizerAgent.propose() по умолчанию
    source: assumption
    comment: >
      Единственная управляющая переменная со стороны гидроочистки и
      главная ручка жёсткости режима. Скорость обессеривания растёт
      с температурой по Аррениусу, поэтому это основной способ вернуть
      серу в спецификацию. Плата — ускоренная деактивация катализатора,
      её оценивает агент надёжности и сужает верхнюю границу.
      Медиана 370.4, шаг = p90 часовых изменений (2.56).
      ТРЕБУЕТ ПРОВЕРКИ: справочник КИП по 24-2000 местами не совпадает
      с данными. T5 ведёт себя как температура реактора (медиана 370.4),
      это согласуется с описанием, но соседние T6 и T11 подписаны
      как анализатор серы и расход сырья, а ведут себя как температуры.
 
# ----------------------------------------------------------------------------
# ЧТО СОЗНАТЕЛЬНО НЕ ВКЛЮЧЕНО, и почему. Это часть обоснования.
# ----------------------------------------------------------------------------
excluded_candidates:
  "AVT:T33":
    reason: >
      Температура низа К-2. На схеме отмечена зелёным, но данные влияния
      не подтверждают: corr с EBP дизельной фракции -0.010 при n=1260.
      В списке ключевых управляющих переменных published-проекта APC
      температура низа также отсутствует. Оставлена как признак модели.
  "AVT:T71":
    reason: >
      Температура фр.290-350 из К-2. Самая сильная связь с EBP во всём
      наборе (+0.335), что физически ожидаемо: температура отбора прямо
      задаёт точку разгонки бокового погона. Но это СЛЕДСТВИЕ отбора и
      орошения, а не независимая ручка. В терминах APC это управляемая
      величина (CV), а не управляющая (MV). Сильный признак для модели.
  "AVT:F65":
    reason: >
      Производительность К-2 по отбензиненной нефти. Задаётся планом
      завода, не оптимизатором. Возмущение (DV), не MV.
  "242000:F26":
    reason: >
      Расход сырья на гидроочистку. Определяется отбором на АВТ выше
      по цепочке, отдельно не назначается. Возмущение (DV).
      Важен как признак: объёмная скорость влияет и на глубину
      обессеривания, и на запаздывание отклика.
  "AVT:T20":
    reason: >
      Температура верха К-2. Управляющая переменная по литературе, но
      управляет разделением нафта-керосин, а не дизельным хвостом:
      corr с EBP +0.037. Для нашей цели бесполезна.
  "AVT:W70":
    reason: >
      Массовый расход фр.290-350. Практически дублирует F30
      (corr с EBP +0.179 против +0.180). Две почти одинаковые переменные
      в оптимизаторе дают вырожденную задачу.
 
# ----------------------------------------------------------------------------
# ПРОБЕЛ, о котором надо сказать на защите.
# ----------------------------------------------------------------------------
# Температура на выходе атмосферных печей П-1/2 и П-1/3 в выданном наборе
# тегов ОТСУТСТВУЕТ. В справочнике КИП есть только T55 — выход вакуумной
# печи П-3. Между тем температура выхода печи входит в список ключевых
# управляющих переменных атмосферной колонны во всех известных проектах APC.
# Ближайший доступный аналог — T6, выход П-1/1, но эта печь питает К-1,
# а не К-2, и связи с дизельным хвостом не показывает (corr -0.014).
# Это ограничение постановки, а не нашей модели. Запросить у организаторов.
 
# Правила отказа от рекомендации
# Целевой запас по жёстким ограничениям.
# Если текущий режим уже даёт запас >= target_margin, система НЕ должна
# выдавать управляющее воздействие: ТЗ прямо требует показать период,
# где лишних действий не создаётся.
decision:
  target_margin:
    sulfur_mgkg: 0.5        # мг/кг
  action_deadband: 0.05     # изменения меньше этой доли max_step считаем нулевыми
 
refusal_rules:
  max_lims_age_min: 1440      # ЛИМС старше суток -> не факт о текущем продукте
  min_confidence: 0.35        # ниже -> система отказывается рекомендовать
  require_healthy_pak: false  # при мёртвом ПАК работаем, но снижаем confidence
 
# Блендинг
blending:
  # Явных компонентов смешения в данных нет. Модельное допущение:
  # дизельный пул = два потока с АВТ, тяжёлый AVT:F30 (фр. 290-350 C)
  # и лёгкий AVT:F32 (фр. 240-290 C). Доли = массовая пропорция.
  # Подробности и что сюда сознательно не вошло — в src/blending.py.
  components: ["AVT:F30", "AVT:F32"]

  # Жёсткая проверка из ТЗ. Доли обязаны давать 100 %.
  components_sum: 1.0
  tolerance: 1.0e-6
  source: spec

  # Ниже этого суммарного расхода доли не определены и Gate получает
  # честное "не знаю" вместо деления на почти ноль. Для сравнения:
  # p01 суммарного расхода пула по истории 155 т/ч, медиана 209 т/ч.
  min_pool_tph: 20.0

  # Содержательная проверка: доля компонента должна оставаться в
  # исторически наблюдавшемся окне. Без неё проверка суммы была бы
  # тавтологией, потому что пропорция даёт единицу по построению.
  # Границы = 1-й и 99-й перцентиль F30/(F30+F32) по очищенной истории
  # 2023-2026, n=181 436. Медиана 0.617, p01 0.544, p99 0.715.
  # Взяты широкие перцентили: это не спека, а защита от режима,
  # которого установка никогда не видела.
  share_range:
    "AVT:F30": [0.54, 0.72]
    "AVT:F32": [0.28, 0.46]
  share_source: assumption
