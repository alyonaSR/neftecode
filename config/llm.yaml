# Языковая модель. Отвечает на вопросы оператора по УЖЕ принятому решению.
#
# ГРАНИЦА ОТВЕТСТВЕННОСТИ: LLM не участвует в принятии решения. Числа,
# отбраковка вариантов и выбор рекомендации считает код, и результат от
# наличия ключа не зависит. Это требование воспроизводимости из ТЗ:
# один и тот же вход обязан давать один и тот же результат.

provider: gemini
model: gemini-3.6-flash

# false = система работает полностью без обращений к модели: ответы
# оператору собираются шаблоном из тех же чисел. Нужно, когда на площадке
# нет интернета, и в тестах, которые не имеют права ходить в сеть.
enabled: true

# Ключ берётся из переменной окружения или из .env в корне проекта.
# В репозиторий ключ не коммитится, .env в .gitignore.
api_key_env: GEMINI_API_KEY

# 0 = максимально детерминированный ответ при одном и том же вопросе.
temperature: 0.0

# Лимит общий: в него входят токены размышления модели, а их уходит
# несколько сотен. При 900 ответ обрывался на середине фразы.
max_output_tokens: 2500

# Глубина размышления. Задача модели - пересказать готовые числа, а не
# решать задачу, поэтому low: быстрее, дешевле и бюджет достаётся ответу.
thinking_level: low

timeout_s: 30

# Проверка чисел в ответе модели. Каждое число из ответа должно
# встречаться в данных решения, иначе ответ помечается как непроверенный.
# strict: true - такой ответ не показывается вообще, печатается шаблон.
verify_numbers: true
strict: false
