# Значения-маркеры шкалы, не измерения (снимаются, только если равны максимуму колонки).
# У 8 колонок 24-2000 максимум ровно 307.00, у 3: 10.00; у AVT:P52 масштаб ряда ±0.0005, так что 307.0 является явным маркером.
sentinel_values: [307.0, 10.0]

# Отрицательные значения: порог масштабный, доля от p99 колонки (|x| < порога -> 0, у F/W/Q ниже -порога -> NaN).
# 2% от p99: у AVT:P52 65% значений -0.00, у AVT:F69 минус не глубже -0.45 при p99 = 307: дрожание нуля, не аномалия.
negative_rule:
  noise_share_of_p99: 0.02
  zero_clip_prefixes: ["F", "W", "Q", "P", "L", "D"]   # температуры не трогаем: -5 degC это физика
  nan_below_threshold_prefixes: ["F", "W", "Q"]        # крупный минус у расхода = аномалия

# Теги, исключённые из признаков. Причина обязательна.
exclude_tags:
  "AVT:D10": "Датчик мёртв: 189207 из 189217 значений равны маркеру 307.0,
              остальные около 240 при норме ~850 кг/м3 для плотности нефти."
  "AVT:F5":  "Расход пара в К-1, но 93% значений отрицательные (медиана -13.6),
              а положительные в 2025-2026 упираются в маркер 307.0.
              В 2025 положительных нет вообще."